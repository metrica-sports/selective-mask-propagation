[project]
name = "sam-deep-eiou"
version = "0.1.0"
description = "Selective mask propagation for multi-object tracking: SAM + Deep-EIoU"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexander Holmberg", email = "alholmbe@kth.se" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "lap>=0.5.12",
    "cython-bbox>=0.1.5",
    "opencv-python>=4.10.0.84",
    "tqdm",
    "trackeval",
    "torch",
    "torchvision",
    "pycocotools>=2.0.11",
    "tabulate>=0.9.0",
    "sam2",
    "sam3",
    "setuptools<81",
    "einops>=0.8.2",
    "psutil>=7.2.2",
    "eva-decord>=0.6.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
gta = [
    "google-genai",
    "transformers",
    "pydantic",
    "python-dotenv",
    "scikit-learn>=1.8.0",
]

[tool.uv.sources]
trackeval = { workspace = true, editable = true }
sam2 = { workspace = true, editable = true }
sam3 = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "TrackEval",
    "vendor/sam2",
    "vendor/sam3",
]

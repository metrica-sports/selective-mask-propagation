[project]
name = "selective-mask-propagation"
version = "0.1.0"
description = "Selective mask propagation for multi-object tracking"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexander Holmberg", email = "alholmbe@kth.se" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "torch",
    "torchvision",
    "pillow",
]

[project.optional-dependencies]
# Everything beyond the OSNet / core utilities: the SAM tracking pipeline, TrackEval and their
# build-heavy deps (cython-bbox needs MSVC on Windows). Upstream-style dev setup: `uv sync --extra full`.
full = [
    "opencv-python>=4.10.0.84",
    "lap>=0.5.12",
    "cython-bbox>=0.1.5",
    "trackeval",
    "pycocotools>=2.0.11",
    "tabulate>=0.9.0",
    "sam2",
    "sam3",
    "setuptools<81",
    "einops>=0.8.2",
    "psutil>=7.2.2",
    "eva-decord>=0.6.1",
    "zstandard>=0.25.0",
]
gta = [
    "google-genai",
    "pydantic",
    "python-dotenv",
    "safetensors",
    "scikit-learn>=1.8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Package directories carry no __init__.py, so they are namespace packages.
include = ["selective_mask_propagation*"]
namespaces = true

[tool.uv.sources]
trackeval = { workspace = true, editable = true }
sam2 = { workspace = true, editable = true }
sam3 = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "TrackEval",
    "vendor/sam2",
    "vendor/sam3",
]

[tool.ruff]
exclude = ["vendor", "TrackEval", "scripts/internal"]

[tool.ruff.lint]
select = ["F", "E9"]
